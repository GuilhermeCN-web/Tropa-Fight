# Ambiente LOCAL do Tropa Fight: PostgreSQL 18 + migrações + aplicação Next.js.
# Os valores padrão abaixo são somente para desenvolvimento local; nunca use credenciais reais.
# Sobrescreva-os com um arquivo `.env` (ignorado pelo Git) na raiz do projeto.

name: tropa-fight

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tropa_fight}
      POSTGRES_USER: ${POSTGRES_USER:-tropa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tropa_local}
    ports:
      # Porta 5433 no host para não conflitar com um PostgreSQL local já instalado.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: tropa-fight-app:local
    command: ['node', 'scripts/db-migrate.mjs']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tropa}:${POSTGRES_PASSWORD:-tropa_local}@db:5432/${POSTGRES_DB:-tropa_fight}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    image: tropa-fight-app:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tropa}:${POSTGRES_PASSWORD:-tropa_local}@db:5432/${POSTGRES_DB:-tropa_fight}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    ports:
      - '${APP_HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
